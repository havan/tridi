[workspace]
name = "tridi"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
# pixi run build <project> [--preset NAME] [--printer KEY|WxDxH] [project options]
build = "python run.py build"
test = "pytest -q"
freecad = "freecad"

[dependencies]
freecad = "1.1.*"
python = "3.12.*"
pytest = "*"
